# Rate-limit zones for wa.edwyz.com. This file belongs in the nginx `http` block, not inside a server block.
# Install: copy to /etc/nginx/conf.d/wa-zones.conf (the stock nginx.conf includes conf.d/*.conf inside http), then
# `nginx -t && systemctl reload nginx`. The zones are used by deploy/nginx-wa.edwyz.com.conf; nginx refuses to
# load that site file if these zones are missing.
limit_req_zone $binary_remote_addr zone=wa_webhooks:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=wa_ext:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=wa_mcp:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=wa_meta:10m rate=5r/s;
# Eddy, the in-app helper (docs/EDDY-SPEC.md 7.8, 7.10): 2 requests a second per address, burst 10 in the site file. The same
# zone covers /api/eddy/, /api/actions/ and /api/notices/. Named wa_eddy (the spec's "eddy") so it cannot clash with another
# tenant's zone in the shared http block.
limit_req_zone $binary_remote_addr zone=wa_eddy:10m rate=2r/s;
limit_req_status 429;
