server {
    listen 443 ssl;
    server_name wa.edwyz.com;

    ssl_certificate /etc/letsencrypt/live/wa.edwyz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wa.edwyz.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 4m;

    # Upload endpoint for the content library: large bodies, streamed straight to the app (no nginx buffering to disk).
    location = /api/content/media {
        client_max_body_size 110m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Inbox attachments (images up to 8 MB, videos up to 100 MB) use the same upload path.
    location ~ ^/api/inbox/conversations/[A-Za-z0-9_-]+/attachments$ {
        client_max_body_size 110m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Meta delivers WhatsApp and lead webhooks here. The burst is generous so a Meta retry storm is not rejected.
    location /webhooks/ {
        limit_req zone=wa_webhooks burst=60 nodelay;
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Public callbacks Meta posts to with no session: /api/meta/deauthorize and /api/meta/data-deletion. They are authenticated by the
    # HMAC signature in the app, not by nginx, so nothing here may deny or auth-gate them. Rate limited per address.
    location ^~ /api/meta/ {
        limit_req zone=wa_meta burst=20 nodelay;
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/ext/ {
        limit_req zone=wa_ext burst=20 nodelay;
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # /api/mcp and /api/mcp/..., but not /api/mcp-connections.
    location ~ ^/api/mcp(/|$) {
        limit_req zone=wa_mcp burst=10 nodelay;
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Eddy (docs/EDDY-SPEC.md 5.12, 7.8, 7.10). nginx does not inherit the proxy_set_header lines of `location /` into another
    # location, so each block below repeats them: without Host the app's same-origin check refuses every turn and confirm, and
    # without the client address every per-address limit would see 127.0.0.1.
    #
    # The streaming turn: server-sent events. No buffering, no cache, no compression (the route also sends
    # X-Accel-Buffering: no and Cache-Control no-transform), and a read timeout above the route's 150 s lifetime (it sends a
    # keepalive every 15 s). An exact match does not pass through the prefix block below, so the rate limit is repeated here.
    location = /api/eddy/turn {
        limit_req zone=wa_eddy burst=10 nodelay;
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 180s;
    }

    # Eddy's other routes (status, conversations, settings).
    location ^~ /api/eddy/ {
        limit_req zone=wa_eddy burst=10 nodelay;
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        gzip off;
        proxy_read_timeout 60s;
    }

    # Confirm, revise, cancel and undo of Eddy's cards (the shared action layer).
    location ^~ /api/actions/ {
        limit_req zone=wa_eddy burst=10 nodelay;
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        gzip off;
        proxy_read_timeout 60s;
    }

    # Eddy's proactive notices.
    location ^~ /api/notices/ {
        limit_req zone=wa_eddy burst=10 nodelay;
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        gzip off;
        proxy_read_timeout 60s;
    }

    # Optional hardening, off by default: only the server itself may call the worker tick and metrics routes. Enable it only
    # after the cron that drives /api/internal/tick calls http://127.0.0.1:3500 directly (docs/ops.md, "Lock down internal routes").
    # location /api/internal/ {
    #     allow 127.0.0.1;
    #     deny all;
    #     proxy_pass http://127.0.0.1:3500;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    # }

    location / {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name wa.edwyz.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot-webroot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
